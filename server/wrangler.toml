# Настройки сервера бесплатного режима для Cloudflare Workers (если ставите через командную строку: npx wrangler deploy).
# Ключ OpenRouter сюда НЕ пишите — он задаётся секретом: npx wrangler secret put OPENROUTER_KEY

name = "konspekt-free"
main = "worker.js"
compatibility_date = "2025-09-01"
# адрес вида https://konspekt-free.<имя>.workers.dev
workers_dev = true

# Свой домен (нужен там, где закрыт workers.dev — например, в России). Домен должен быть добавлен в Cloudflare
# (бесплатный тариф подходит): его серверы имён прописываются у регистратора. Потом раскомментируйте строки ниже,
# подставьте свой домен и добавьте этот адрес в FREE_PROXY_URLS в js/config.js — приложение возьмёт тот, что отвечает.
# [[routes]]
# pattern = "ai.ваш-домен.ru"
# custom_domain = true

# запасной бесплатный ИИ Cloudflare (Workers AI): отвечает, когда у OpenRouter кончился дневной лимит; карта не нужна
[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "REQUEST_LIMITS"
class_name = "RequestLimits"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RequestLimits"]

[vars]
# сайт приложения; несколько — через запятую
ALLOWED_ORIGINS = "https://stairrax.github.io"
# модель для всех пользователей: "free" — бесплатные модели OpenRouter (сервер подбирает сам, платить не нужно),
# или названия моделей через запятую (первая — основная, остальные — запасные), например "google/gemini-2.5-flash"
MODELS = "free"
# куда ходит сервер: OpenRouter или другой сервис с OpenAI-совместимым API
UPSTREAM = "https://openrouter.ai/api/v1"
# запросов в сутки на одно устройство и на один IP-адрес (один конспект — это примерно 10–30 запросов)
DAILY_PER_DEVICE = "30"
DAILY_PER_IP = "100"
# общий запас для всех пользователей; лимит OpenRouter может быть ниже
DAILY_TOTAL = "900"
# максимальная длина одного ответа в токенах
MAX_TOKENS = "16000"
