# Автотесты на каждый push и pull request: настоящий Chromium, нейросеть и голос — заглушки (tests/lib.mjs).
name: Тесты

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04 # Playwright 1.56 не ставит Chromium на Ubuntu 26.04 (ubuntu-latest)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/verify-lame-sri.mjs
      # Ubuntu runner already includes the Chromium runtime libraries.
      # --with-deps invokes apt and can fail on transient Ubuntu mirror DNS outages,
      # preventing npm test from starting even when the JS dependencies are fine.
      - run: npx playwright install chromium
      - run: npm test
      - name: Собрать отдельные файлы этого изменения
        if: always() && github.head_ref == 'feature/private-usage-graph-first-user-2026-11-13'
        run: |
          mkdir -p review-files/server review-files/tests review-files/.github/workflows
          cp server/{usage-stats.js,usage-page.js,worker.js,wrangler.toml,README.md} review-files/server/
          cp tests/51-anonymous-usage.test.mjs review-files/tests/
          cp .github/workflows/first-usage.yml review-files/.github/workflows/
      - uses: actions/upload-artifact@v4
        if: always() && github.head_ref == 'feature/private-usage-graph-first-user-2026-11-13'
        with:
          name: usage-first-user-source-files
          path: review-files/
          retention-days: 7
