# Автотесты на каждый push и pull request: настоящий Chromium, нейросеть и голос — заглушки (tests/lib.mjs).
name: Тесты

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04 # Playwright 1.56 не ставит Chromium на Ubuntu 26.04 (ubuntu-latest)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Проверить синтаксис необязательного локального теста с Ollama
        run: node --check server/backup-browser-ollama.mjs
      - name: Синтаксис сценария проверки конспектов (без Ollama в CI)
        run: node --check server/ollama-quality-browser.mjs
      - name: Локальный резервный сервер — без облака и ключей
        run: npm run test:backup
      - run: npx playwright install --with-deps chromium
      - run: npm test
