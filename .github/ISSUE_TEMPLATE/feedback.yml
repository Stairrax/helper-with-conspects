name: "Обратная связь / Feedback"
description: "Сообщить об ошибке или предложить идею / Report a bug or suggest an improvement"
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что помогаете улучшать Диктор конспектов!
        Please do not include private notes, passwords, API keys, or personal data.
  - type: dropdown
    id: category
    attributes:
      label: "Тип обращения / Type of feedback"
      options:
        - "Ошибка / Bug"
        - "Идея / Feature request"
        - "Другое / Other"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: "Что произошло или что вы предлагаете? / Details"
      description: "Опишите своими словами без личных материалов и секретов / Describe the issue without personal material or secrets"
      placeholder: "Что ожидали, что произошло, или что можно улучшить? / What did you expect, what happened, or what could improve?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Как повторить ошибку? / Steps to reproduce (optional)"
      description: "Если это ошибка, укажите шаги; не вставляйте содержимое личных конспектов / If this is a bug, add steps without private notes"
